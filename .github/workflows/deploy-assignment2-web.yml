name: Deploy Assignment 2 Web App

on:
  push:
    branches: [main]
    paths:
      - "Assignment_2/**"
      - ".github/workflows/deploy-assignment2-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Assignment_2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Export web build
        run: npx expo export --platform web --output-dir dist

      - name: Fix asset paths for GitHub Pages project subpath
        run: |
          find dist -type f \( -name "*.html" -o -name "*.js" \) -print0 | \
            xargs -0 sed -i \
              -e 's#"/assets/#"./assets/#g' \
              -e 's#"/_expo/#"./_expo/#g' \
              -e 's#href="/favicon.ico"#href="./favicon.ico"#g'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Assignment_2/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
